name: Daily Portfolio Stock Update

on:
  schedule:
    # Run daily at 14:00 UTC (which is 8:00 AM your local time, UTC-6).
    # NOTE: this is the SINGLE owner of the automated daily run. If you also run
    # the pipeline locally (scheduler.py or a manual `python test_run.py`) on the
    # same GEMINI_API_KEY, both runs share the same tiny daily quota and will
    # collide. Pick one: either let this Action be the daily runner, or disable
    # this schedule and run locally -- not both.
    - cron: '0 14 * * *'
  workflow_dispatch: # Enables manual run trigger via the GitHub web interface

# Prevent overlapping runs (e.g. the cron and a manual dispatch firing close
# together) from stacking and double-spending the Gemini quota. A new run waits
# for / supersedes an in-flight one instead of running concurrently.
concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Portfolio Stock Update Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}                 # optional override; defaults in agent.py
        GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }} # optional override; defaults in agent.py
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: python test_run.py
